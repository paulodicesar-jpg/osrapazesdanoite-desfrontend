<div
  class="filtros"
  role="group"
  aria-label="Busca e filtros de tarefas"
>

  <label>
    Buscar por título ou responsável
    <input
      type="search"
      placeholder="Digite para pesquisar..."
      [value]="filtros.busca()"
      (input)="filtros.busca.set($any($event.target).value)"
    />
  </label>

  <label>
    Filtrar por status
    <select
      (change)="filtros.statusSelecionado.set($any($event.target).value)"
    >
      <option value="" [selected]="filtros.statusSelecionado() === ''">Todos os status</option>
      <option value="a-fazer" [selected]="filtros.statusSelecionado() === 'a-fazer'">A fazer</option>
      <option value="em-andamento" [selected]="filtros.statusSelecionado() === 'em-andamento'">Em andamento</option>
      <option value="em-revisao" [selected]="filtros.statusSelecionado() === 'em-revisao'">Em revisão</option>
      <option value="concluida" [selected]="filtros.statusSelecionado() === 'concluida'">Concluída</option>
    </select>
  </label>

  <label>
    Filtrar por prioridade
    <select
      (change)="filtros.prioridadeSelecionada.set($any($event.target).value)"
    >
      <option value="" [selected]="filtros.prioridadeSelecionada() === ''">Todas as prioridades</option>
      <option value="baixa" [selected]="filtros.prioridadeSelecionada() === 'baixa'">Baixa</option>
      <option value="media" [selected]="filtros.prioridadeSelecionada() === 'media'">Média</option>
      <option value="alta" [selected]="filtros.prioridadeSelecionada() === 'alta'">Alta</option>
    </select>
  </label>

</div>
